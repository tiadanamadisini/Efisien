<!-- Popup Settings -->
<div class="settings-popup" id="settingsPopup">
    <div class="settings-content">
      <div class="settings-header">
        <h2 class="settings-title">
          <i class="fas fa-lock"></i>
          TETAPAN EKSKLUSIF
        </h2>
        <button class="close-settings" id="closeSettings">
          <i class="fas fa-times"></i>
        </button>
      </div>
      
      <div class="settings-group">
        <label class="settings-label">Tema Aplikasi</label>
        <select class="settings-select" id="themeSelect">
          <option value="dark">Gelap (Default)</option>
          <option value="darker">Gelap Premium</option>
          <option value="amoled">Hitam AMOLED</option>
        </select>
      </div>
      
      <div class="settings-group">
        <div class="switch-container">
          <span class="settings-label">Tampilkan Konten Premium</span>
          <label class="switch">
            <input type="checkbox" id="premiumToggle" checked>
            <span class="slider"></span>
          </label>
        </div>
        
        <div class="switch-container">
          <span class="settings-label">Notifikasi Baru</span>
          <label class="switch">
            <input type="checkbox" id="notifToggle">
            <span class="slider"></span>
          </label>
        </div>
      </div>
      
      <div class="settings-group">
        <label class="settings-label">Kualiti Gambar</label>
        <select class="settings-select" id="qualitySelect">
          <option value="auto">Auto (Disyorkan)</option>
          <option value="high">Tinggi</option>
          <option value="medium">Sederhana</option>
          <option value="low">Rendah</option>
        </select>
      </div>
      
      <button class="settings-button" id="saveSettings">
        <i class="fas fa-save"></i> SIMPAN TETAPAN
      </button>
      
      <div class="settings-footer">
        Tetapan ini akan disimpan untuk akaun anda sahaja
      </div>
    </div>
  </div>
  <script src="js/setting.js"></script>
  <script>
    // Sidebar toggle
menuToggle.addEventListener('click', () => {
  sidebar.classList.toggle('show');
  menuToggle.innerHTML = sidebar.classList.contains('show') ?

      }
    ];

    // DOM Elements
    const gallery = document.getElementById('gallery');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxClose = document.getElementById('lightboxClose');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    // State
    let currentIndex = 0;
    let touchStartX = 0;
    let touchEndX = 0;

    // Render Gallery
    function renderGallery() {
      gallery.innerHTML = galleryData.map((item, index) => `
        <div class="gallery-item" data-index="${index}">
          ${item.premium ? '<div class="premium-tag">PREMIUM</div>' : ''}
          <img src="${item.image}" alt="${item.title}" class="gallery-img">
          <div class="item-overlay">
            <h3 class="item-title">${item.title}</h3>
            <p class="item-desc">${item.desc}</p>
          </div>
        </div>
      `).join('');

      // Add event listeners to gallery items
      document.querySelectorAll('.gallery-item').forEach(item => {
        item.addEventListener('click', () => {
          currentIndex = parseInt(item.dataset.index);
          openLightbox(currentIndex);
        });

        // Touch events for mobile
        item.addEventListener('touchstart', handleTouchStart, { passive: true });
        item.addEventListener('touchend', handleTouchEnd, { passive: true });
      });
    }

    // Lightbox Functions
    function openLightbox(index) {
      currentIndex = index;
      lightboxImg.src = galleryData[currentIndex].image;
      lightbox.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
      document.body.style.overflow = 'auto';
    }

    function navigate(direction) {
      currentIndex += direction;
      
      if (currentIndex < 0) {
        currentIndex = galleryData.length - 1;
      } else if (currentIndex >= galleryData.length) {
        currentIndex = 0;
      }
      
      lightboxImg.src = galleryData[currentIndex].image;
    }

    // Touch Handling for Mobile Swipe
    function handleTouchStart(e) {
      touchStartX = e.changedTouches[0].screenX;
    }

    function handleTouchEnd(e) {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    }

    function handleSwipe() {
      if (touchStartX - touchEndX > 50) {
        // Swipe left - next
        navigate(1);
      } else if (touchEndX - touchStartX > 50) {
        // Swipe right - prev
        navigate(-1);
      }
    }

    // Event Listeners
    lightboxClose.addEventListener('click', closeLightbox);
    prevBtn.addEventListener('click', () => navigate(-1));
    nextBtn.addEventListener('click', () => navigate(1));

    // Keyboard Navigation
    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('active')) return;
      
      if (e.key === 'Escape') {
        closeLightbox();
      } else if (e.key === 'ArrowLeft') {
        navigate(-1);
      } else if (e.key === 'ArrowRight') {
        navigate(1);
      }
    });

    // Close lightbox when clicking outside image
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) {
        closeLightbox();
      }
    });

    // Initialize
    renderGallery();
  </script>
